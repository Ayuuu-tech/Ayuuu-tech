name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Ayuuu-tech
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0EA5E9
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#050A14,#0C4A6E,#0284C7,#38BDF8,#A5F3FC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
