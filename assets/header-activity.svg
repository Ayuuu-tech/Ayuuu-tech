<svg xmlns="http://www.w3.org/2000/svg" width="900" height="76" viewBox="0 0 900 76" role="img" aria-label="ACTIVITY">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#060b16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ht" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="74" rx="20" fill="url(#hg)" stroke="#0ea5e9" stroke-opacity="0.45"/>

  <g stroke="#22d3ee" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M26 26v-8h10"/><path d="M26 50v8h10"/>
  </g>

  <rect x="52" y="24" width="46" height="28" rx="9" fill="#0ea5e9" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="75" y="43" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
        font-size="13" fill="#7dd3fc">06</text>

  <text x="118" y="35" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21"
