<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="ACHIEVEMENT MATRIX">

  <defs>
    <linearGradient id="bg-ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d1a"/><stop offset="100%" stop-color="#02040a"/>
